name: CI

# Lưu ý: "runs-on: ubuntu-latest" là hệ điều hành của MÁY ẢO CHẠY CI trên
# server GitHub (cloud runner) — không liên quan gì đến máy local của bạn.
# Dù bạn code trên Windows, workflow này vẫn chạy đúng, vì nó không hề
# chạy trên máy bạn; GitHub tự cấp một VM Ubuntu tạm thời cho mỗi lần chạy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend-ai/requirements-ci.txt

      - name: Install dependencies
        # Cố tình KHÔNG cài requirements.txt đầy đủ ở đây: torch/vllm/
        # sentence-transformers cần GPU và hàng GB dung lượng, không khả thi
        # trên GitHub-hosted runner. requirements-ci.txt là bộ dependency nhẹ
        # dùng riêng cho lint/test — xem chú thích trong tests/conftest.py.
        run: pip install -r requirements-ci.txt

      - name: Install tesseract-ocr (cho tests/test_ingestion_ocr.py)
        # Nhẹ, không cần GPU — cài thật để test OCR chạy với binary thật
        # thay vì mock, vì đây đúng là phần dễ âm thầm hỏng nhất (đổi
        # ngưỡng, đổi API pytesseract, quên cài binary ở production).
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-vie

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v
