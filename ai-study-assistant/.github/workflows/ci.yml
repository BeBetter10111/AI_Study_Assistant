name: CI

# Note: "runs-on: ubuntu-latest" is the OS of the CI virtual machine on
# GitHub's server (cloud runner) — it has nothing to do with your local machine.
# Even if you develop on Windows, this workflow still works because it does not
# run on your machine; GitHub provides a temporary Ubuntu VM for each run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # cd.yml calls this workflow with `uses: ./.github/workflows/ci.yml`. Without this trigger, GitHub
  # reports "workflow is not reusable" and the CD pipeline cannot run.
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend-ai/requirements-ci.txt

      - name: Install dependencies
        # Intentionally do NOT install the full requirements.txt here: torch/vllm/
        # sentence-transformers require a GPU and several gigabytes of storage, which is impractical
        # on GitHub-hosted runners. requirements-ci.txt is the lightweight dependency set
        # for lint/tests — see the comments in tests/conftest.py.
        run: pip install -r requirements-ci.txt

      - name: Install tesseract-ocr (cho tests/test_ingestion_ocr.py)
        # Lightweight and requires no GPU — install it for real so OCR tests use the actual binary
        # instead of a mock; this is the part most likely to fail silently (threshold changes,
        # pytesseract API changes, or forgetting to install the binary in production).
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-vie

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v
