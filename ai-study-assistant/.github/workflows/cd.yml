name: CD — Build, Push & Deploy

# Flow: build (after tests pass) -> push image to GHCR -> deploy-staging (automatic)
# -> deploy-production (REQUIRES manual approval via "environment: production").
#
# Configure these once in the GitHub repository (Settings > Environments):
#   - Environment "staging": no reviewer required.
#   - Environment "production": enable "Required reviewers" — this is the
#     approval gate; GitHub pauses the job and waits for an authorized person
#     to click "Approve" before continuing.
# Required secrets (Settings > Secrets and variables > Actions):
#   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY
#   PROD_HOST, PROD_USER, PROD_SSH_KEY

on:
  push:
    branches: [main]
    tags: ["v*"] # Use tags such as v1.0.0 to create a release image.

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # Rerun CI as a gate — do not build/push the image if tests fail.
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags/labels — backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-ai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between CI runs using GitHub Actions cache — subsequent builds are much faster
          # because the base image/pip packages do not need to be downloaded again each time.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract tags/labels — frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (lấy scripts/smoke_test.sh)
        uses: actions/checkout@v4

      - name: SSH deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Chờ container healthy rồi mới coi là deploy xong
        # docker-compose.yml defines health checks for backend-ai/frontend —
        # this step waits for Docker to report "healthy" instead of guessing with a fixed sleep.
        # If they are not healthy after 2 minutes, treat the deployment as failed.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            for i in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' asa_backend 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "backend healthy"; exit 0
              fi
              echo "Chờ backend healthy (lần $i/24): $status"
              sleep 5
            done
            echo "TIMEOUT: backend không healthy sau 2 phút"; exit 1

      - name: Smoke test staging
        env:
          BASE_URL: https://staging.myapp.com
        run: bash scripts/smoke_test.sh

      - name: Rollback nếu smoke test fail
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            echo "Smoke test fail -> rollback về image 'previous'"
            export IMAGE_TAG=previous
            docker compose up -d
            echo "Đã rollback staging về bản trước đó"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # "environment: production" with Required reviewers enabled in the repository
    # settings IS the approval gate: this job pauses, displays the
    # "Review deployments" button to the designated reviewers, and continues
    # only after someone clicks Approve.
    environment: production
    steps:
      - name: Checkout (lấy scripts/smoke_test.sh)
        uses: actions/checkout@v4

      - name: Gắn thẻ image đang chạy là "previous" trước khi deploy bản mới
        # This is the simplest rollback mechanism with docker compose (no
        # replicas/load balancer): always keep the previous build tagged
        # "previous" so it can be restored immediately if the new build fails.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            docker tag ghcr.io/${{ env.IMAGE_BACKEND }}:latest ghcr.io/${{ env.IMAGE_BACKEND }}:previous || true
            docker tag ghcr.io/${{ env.IMAGE_FRONTEND }}:latest ghcr.io/${{ env.IMAGE_FRONTEND }}:previous || true

      - name: SSH deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Chờ container healthy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            for i in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' asa_backend 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "backend healthy"; exit 0
              fi
              echo "Chờ backend healthy (lần $i/24): $status"
              sleep 5
            done
            echo "TIMEOUT: backend không healthy sau 2 phút"; exit 1

      - name: Smoke test production
        env:
          BASE_URL: https://myapp.com
        run: bash scripts/smoke_test.sh

      - name: Rollback về bản trước nếu smoke test fail
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            echo "Smoke test fail -> rollback production về image 'previous'"
            export IMAGE_TAG=previous
            docker compose up -d
            echo "Đã rollback production về bản trước đó — cần kiểm tra thủ công nguyên nhân"
