[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["scripts"]

[tool.ruff.lint]
# Minimal CI rules: clear syntax/logic errors (Pyflakes) + import
# ordering (isort). Style/formatting rules are intentionally disabled so CI is not blocked
# for cosmetic reasons while the project is still changing rapidly.
select = ["E9", "F", "I"]
