# Phục vụ bản build tĩnh của SPA React. Chạy bằng user nginx (không root) nên nghe cổng 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Lưu ý: add_header trong `location` GHI ĐÈ add_header ở cấp server, nên lặp lại header bảo mật ở mỗi nơi.
    # File trong /assets/ có hash trong tên => cache vĩnh viễn.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: mọi đường dẫn khác trả index.html (đường dẫn dạng #/profile không tới server, nhưng F5 ở "/" thì có).
    # index.html KHÔNG được cache để bản build mới có hiệu lực ngay.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
