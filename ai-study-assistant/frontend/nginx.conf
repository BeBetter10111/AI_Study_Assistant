# Serve the static React SPA build. Runs as the nginx user (non-root), so it listens on port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Note: add_header in `location` OVERRIDES server-level add_header, so repeat security headers in each location.
    # Files in /assets/ have hashed names => cache them indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: serve index.html for all other paths (hash routes such as #/profile do not reach the server, but refreshing "/" does).
    # Do NOT cache index.html so new builds take effect immediately.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
